<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body onload="init()">
    <header>
        <img src="./assets/icons/FavIcon.png" alt="favicon">
        <h2>Fotogramm</h2>
    </header>
    <section class="content">
        <h1>
            My personal photo album
        </h1>
        <div class="bildWrapper">
            <img src="./assets/bilder/bild1.jpg" alt="bild1" onclick="openDialog()">
            <img src="./assets/bilder/bild2.jpg" alt="bild2">
            <dialog id="dialogfeld" class="dialogfeld">
                <div class="dialogHeader">
                    <p>bild1</p>
                    <img src="./assets/icons/close.png" alt="close" onclick="closeDialog()" class="closeDialog">
                </div>
                <img src="./assets/bilder/bild1.jpg" alt="Bild1" class="bildDialog">
                <div class="dialogFooter">
                    <img src="./assets/icons/pfeil.png" alt="weiter" class="bildVor">
                    <p>x/13</p>
                    <img src="./assets/icons/pfeil.png" alt="weiter" class="bildZurück">
                </div>
            </dialog>
        </div>
        
    </section>
    <footer>
        <div class="footerLogo">
            <img src="./assets/icons/Icon.png" alt="DVA-Icon">
            <p>Developer <br> Akademie</p>
        </div>
        <p>© 2023 Developer Akademie GmbH</p>
    </footer>
</body>
</html>
